<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuffle Presets Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 12px; background: #334155; padding: 4px 10px; border-radius: 9999px; color: #cbd5e1; }
    
    /* Actions Bar */
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; justify-content: space-between; }
    .toolbar-left { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .group-filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn { background: #1e293b; border: 1px solid var(--border); color: #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .filter-btn:hover { opacity: 0.9; }

    .active-toggle-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #cbd5e1; cursor: pointer; background: #1e293b; border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; user-select: none; }
    .active-toggle-label:hover { border-color: #475569; }
    .active-toggle-label input { accent-color: var(--primary); cursor: pointer; }

    .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .btn:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Modal / Form */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #cbd5e1; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 14px; }
    .form-control:focus { outline: none; border-color: var(--primary); }
    textarea.form-control { min-height: 140px; font-family: monospace; font-size: 13px; }
    .form-help { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Presets Grid */
    .presets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .preset-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: border-color 0.15s, transform 0.15s; position: relative; }
    .preset-card:hover { border-color: #475569; }
    .preset-card.inactive { opacity: 0.55; }
    
    /* Card Thumbnail */
    .card-thumb-container { width: 100%; height: 160px; background: #0b1120; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .card-thumb { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s, transform 0.2s; opacity: 0; }
    .card-thumb.loaded { opacity: 1; }
    .card-thumb:hover { transform: scale(1.03); }
    .card-thumb-placeholder { position: absolute; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .card-thumb-refresh { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity 0.15s; }
    .card-thumb-container:hover .card-thumb-refresh { opacity: 1; }

    .card-content { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .preset-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
    .preset-name { font-weight: 600; font-size: 15px; line-height: 1.4; word-break: break-all; }
    .preset-group { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #334155; color: #93c5fd; margin-bottom: 8px; width: fit-content; }

    .query-summary { background: #0f172a; border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #cbd5e1; font-family: monospace; max-height: 50px; overflow-y: auto; margin-bottom: 12px; word-break: break-all; }

    .preset-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; margin-top: auto; }
    .preset-actions { display: flex; gap: 8px; }

    /* Switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #475569; transition: .2s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Preview Popover */
    .preview-modal { max-width: 700px; text-align: center; }
    .preview-img-container { min-height: 300px; max-height: 520px; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 8px; margin-top: 12px; overflow: hidden; }
    .preview-img { max-width: 100%; max-height: 520px; object-fit: contain; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Shuffle Presets Manager <span class="badge" id="stats-badge">0 / 0 有効</span></h1>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" onclick="openCreateModal()">＋ 新規プリセット追加</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="group-filters" id="group-filters">
        <button class="filter-btn active" onclick="setFilter('all')">すべて</button>
      </div>
      <label class="active-toggle-label">
        <input type="checkbox" id="filter-active-only" onchange="toggleActiveOnly(this.checked)">
        <span>Active のみ表示</span>
      </label>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-secondary btn-sm" onclick="toggleCurrentGroup(true)">このグループを全有効</button>
      <button class="btn btn-secondary btn-sm" onclick="toggleCurrentGroup(false)">このグループを全無効</button>
    </div>
  </div>

  <div class="presets-grid" id="presets-container">
    <!-- Presets will be loaded here -->
  </div>
</div>

<!-- Edit / Create Modal -->
<div class="modal-overlay" id="preset-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">プリセット作成</div>
      <button class="close-btn" onclick="closeModal('preset-modal')">&times;</button>
    </div>
    <form id="preset-form" onsubmit="handleSavePreset(event)">
      <input type="hidden" id="edit-id" value="">
      
      <div class="form-group">
        <label for="edit-name">プリセット名 *</label>
        <input type="text" id="edit-name" class="form-control" placeholder="例: Landscape Photos, Cat Videos" required>
      </div>

      <div class="form-group">
        <label for="edit-group">グループ名</label>
        <input type="text" id="edit-group" class="form-control" placeholder="例: nature, animals, favorites">
        <div class="form-help">Apple TV等から ?group=&lt;グループ名&gt; で絞り込めるタグです</div>
      </div>

      <div class="form-group">
        <label for="edit-query">PiGallery2 検索クエリ (JSON) *</label>
        <textarea id="edit-query" class="form-control" placeholder='{"type": 104, "value": "landscape"}' required></textarea>
        <div class="form-help">PiGallery2 WebUI で検索後、「To .pg2conf」やSaved SearchからコピーしたJSONを貼り付けてください。</div>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:10px;">
        <label class="switch">
          <input type="checkbox" id="edit-active" checked>
          <span class="slider"></span>
        </label>
        <span style="font-size:14px;">シャッフル抽選対象にする (Active)</span>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
        <button type="button" class="btn btn-secondary" onclick="closeModal('preset-modal')">キャンセル</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="preview-modal">
  <div class="modal preview-modal">
    <div class="modal-header">
      <div class="modal-title" id="preview-title">プレビュー</div>
      <button class="close-btn" onclick="closeModal('preview-modal')">&times;</button>
    </div>
    <div id="preview-info" style="font-size:13px; color:var(--text-muted); margin-bottom:8px;"></div>
    <div class="preview-img-container">
      <img id="preview-image" class="preview-img" src="" alt="Loading...">
    </div>
    <div style="display:flex; justify-content:space-between; margin-top:16px;">
      <button class="btn btn-secondary btn-sm" id="preview-retry-btn">別の画像を引く</button>
      <button class="btn btn-secondary btn-sm" onclick="closeModal('preview-modal')">閉じる</button>
    </div>
  </div>
</div>

<script>
  let allPresets = [];
  let currentFilter = 'all';
  let activeOnly = false;
  // Cache fetched sample thumbnail URLs per preset id so switching filters doesn't refetch
  const thumbCache = new Map();

  async function loadPresets() {
    try {
      const res = await fetch('/pgapi/gallery/random/presets');
      const data = await res.json();
      if (data && data.result) {
        allPresets = data.result;
        render();
      }
    } catch (e) {
      alert('プリセットの読み込みに失敗しました: ' + e);
    }
  }

  function render() {
    renderFilters();
    renderPresets();
    updateStats();
  }

  function updateStats() {
    const total = allPresets.length;
    const active = allPresets.filter(p => p.active !== false).length;
    document.getElementById('stats-badge').innerText = `${active} / ${total} 有効`;
  }

  function renderFilters() {
    const groups = Array.from(new Set(allPresets.map(p => p.group || '').filter(Boolean))).sort();
    const container = document.getElementById('group-filters');
    container.innerHTML = `
      <button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">すべて (${allPresets.length})</button>
    `;
    groups.forEach(g => {
      const count = allPresets.filter(p => p.group === g).length;
      const btn = document.createElement('button');
      btn.className = `filter-btn ${currentFilter === g ? 'active' : ''}`;
      btn.innerText = `${g} (${count})`;
      btn.onclick = () => setFilter(g);
      container.appendChild(btn);
    });
  }

  function setFilter(group) {
    currentFilter = group;
    render();
  }

  function toggleActiveOnly(checked) {
    activeOnly = checked;
    render();
  }

  function renderPresets() {
    const container = document.getElementById('presets-container');
    container.innerHTML = '';

    let filtered = currentFilter === 'all'
      ? allPresets
      : allPresets.filter(p => (p.group || '') === currentFilter);

    if (activeOnly) {
      filtered = filtered.filter(p => p.active !== false);
    }

    if (filtered.length === 0) {
      container.innerHTML = '<div style="color:var(--text-muted); padding:30px; grid-column:1/-1; text-align:center;">条件に一致するプリセットがありません</div>';
      return;
    }

    filtered.forEach(preset => {
      const card = document.createElement('div');
      card.className = `preset-card ${preset.active === false ? 'inactive' : ''}`;
      card.id = `preset-card-${preset.id}`;

      const queryStr = JSON.stringify(preset.searchQuery || {});
      const galleryUrl = `/search/${encodeURIComponent(queryStr)}`;

      card.innerHTML = `
        <div class="card-thumb-container" onclick="testPreview(${preset.id})">
          <div class="card-thumb-placeholder" id="thumb-placeholder-${preset.id}">📷 読み込み中...</div>
          <img class="card-thumb" id="thumb-img-${preset.id}" alt="${escapeHtml(preset.name)}">
          <button class="card-thumb-refresh" onclick="event.stopPropagation(); loadThumbnail(${preset.id}, true);" title="画像を更新">🔄 更新</button>
        </div>
        <div class="card-content">
          <div>
            <div class="preset-header">
              <div class="preset-name">${escapeHtml(preset.name)}</div>
              <label class="switch">
                <input type="checkbox" ${preset.active !== false ? 'checked' : ''} onchange="togglePreset(${preset.id}, this.checked)">
                <span class="slider"></span>
              </label>
            </div>
            ${preset.group ? `<span class="preset-group">${escapeHtml(preset.group)}</span>` : ''}
            <div class="query-summary" title="${escapeHtml(queryStr)}">${escapeHtml(queryStr)}</div>
          </div>
          <div class="preset-footer">
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary btn-sm" onclick="testPreview(${preset.id})">🔍 拡大</button>
              <a href="${galleryUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm" title="PiGallery2 で検索結果一覧を開く">🔗 ギャラリー</a>
            </div>
            <div class="preset-actions">
              <button class="btn btn-secondary btn-sm" onclick="openEditModal(${preset.id})">編集</button>
              <button class="btn btn-danger btn-sm" onclick="deletePreset(${preset.id})">削除</button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Lazy load thumbnail for each visible card
      loadThumbnail(preset.id, false);
    });
  }

  async function loadThumbnail(presetId, forceRefresh = false) {
    const target = allPresets.find(p => p.id === presetId);
    if (!target) return;

    const imgEl = document.getElementById(`thumb-img-${presetId}`);
    const placeholderEl = document.getElementById(`thumb-placeholder-${presetId}`);
    if (!imgEl) return;

    if (!forceRefresh && thumbCache.has(presetId)) {
      const cachedSrc = thumbCache.get(presetId);
      if (cachedSrc) {
        imgEl.src = cachedSrc;
        imgEl.classList.add('loaded');
        if (placeholderEl) placeholderEl.style.display = 'none';
        return;
      }
    }

    try {
      const queryEncoded = encodeURIComponent(JSON.stringify(target.searchQuery || {}));
      const randomNonce = Math.random().toString(36).substring(2);
      const res = await fetch(`/pgapi/gallery/random/${queryEncoded}/info?_r=${randomNonce}`);
      const data = await res.json();
      if (data && data.result) {
        const item = data.result;
        const segments = [item.directory.path, item.directory.name, item.name]
          .filter(Boolean)
          .map(s => s.replace(/^\/+|\/+$/g, ''))
          .filter(s => s && s !== '.');
        const encodedPath = segments.map(encodeURIComponent).join('/');
        const imgSrc = `/pgapi/gallery/content/${encodedPath}/1080`;

        thumbCache.set(presetId, imgSrc);
        imgEl.src = imgSrc;
        imgEl.onload = () => {
          imgEl.classList.add('loaded');
          if (placeholderEl) placeholderEl.style.display = 'none';
        };
      } else {
        if (placeholderEl) placeholderEl.innerText = '該当なし';
      }
    } catch (e) {
      if (placeholderEl) placeholderEl.innerText = 'エラー';
    }
  }

  async function togglePreset(id, active) {
    try {
      const res = await fetch('/pgapi/gallery/random/presets/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, active })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Error');
      const target = allPresets.find(p => p.id === id);
      if (target) target.active = active;
      const card = document.getElementById(`preset-card-${id}`);
      if (card) {
        if (active) card.classList.remove('inactive');
        else card.classList.add('inactive');
      }
      updateStats();
    } catch (e) {
      alert('切り替えに失敗しました: ' + e);
      loadPresets();
    }
  }

  async function toggleCurrentGroup(active) {
    const targets = currentFilter === 'all'
      ? allPresets
      : allPresets.filter(p => (p.group || '') === currentFilter);

    for (const p of targets) {
      if (p.active !== active) {
        p.active = active;
        await fetch('/pgapi/gallery/random/presets/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: p.id, active })
        });
      }
    }
    render();
  }

  function openCreateModal() {
    document.getElementById('modal-title').innerText = '新規プリセット追加';
    document.getElementById('edit-id').value = '';
    document.getElementById('edit-name').value = '';
    document.getElementById('edit-group').value = currentFilter !== 'all' ? currentFilter : '';
    document.getElementById('edit-query').value = '';
    document.getElementById('edit-active').checked = true;
    document.getElementById('preset-modal').classList.add('open');
  }

  function openEditModal(id) {
    const target = allPresets.find(p => p.id === id);
    if (!target) return;
    document.getElementById('modal-title').innerText = 'プリセット編集';
    document.getElementById('edit-id').value = target.id;
    document.getElementById('edit-name').value = target.name || '';
    document.getElementById('edit-group').value = target.group || '';
    document.getElementById('edit-query').value = JSON.stringify(target.searchQuery || {}, null, 2);
    document.getElementById('edit-active').checked = target.active !== false;
    document.getElementById('preset-modal').classList.add('open');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  async function handleSavePreset(e) {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const name = document.getElementById('edit-name').value.trim();
    const group = document.getElementById('edit-group').value.trim();
    const active = document.getElementById('edit-active').checked;
    let searchQuery = {};

    try {
      searchQuery = JSON.parse(document.getElementById('edit-query').value);
    } catch (err) {
      alert('クエリJSONの構文が正しくありません: ' + err);
      return;
    }

    const payload = { name, group, active, searchQuery };
    const url = id ? `/pgapi/gallery/random/presets/${id}` : '/pgapi/gallery/random/presets';
    const method = id ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Error');
      closeModal('preset-modal');
      thumbCache.delete(parseInt(id, 10));
      await loadPresets();
    } catch (err) {
      alert('保存に失敗しました: ' + err);
    }
  }

  async function deletePreset(id) {
    const target = allPresets.find(p => p.id === id);
    if (!confirm(`プリセット「${target ? target.name : id}」を削除してもよろしいですか？`)) return;

    try {
      const res = await fetch(`/pgapi/gallery/random/presets/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || 'Error');
      thumbCache.delete(id);
      await loadPresets();
    } catch (err) {
      alert('削除に失敗しました: ' + err);
    }
  }

  async function testPreview(id) {
    const target = allPresets.find(p => p.id === id);
    if (!target) return;

    const modal = document.getElementById('preview-modal');
    const title = document.getElementById('preview-title');
    const info = document.getElementById('preview-info');
    const img = document.getElementById('preview-image');
    const retryBtn = document.getElementById('preview-retry-btn');

    title.innerText = `プレビュー: ${target.name}`;
    info.innerText = '画像を取得中...';
    img.src = '';
    modal.classList.add('open');

    async function fetchImage() {
      info.innerText = '画像を取得中...';
      img.src = '';
      try {
        const queryEncoded = encodeURIComponent(JSON.stringify(target.searchQuery));
        const randomNonce = Math.random().toString(36).substring(2);
        const res = await fetch(`/pgapi/gallery/random/${queryEncoded}/info?_r=${randomNonce}`);
        const data = await res.json();
        if (data && data.result) {
          const item = data.result;
          info.innerText = `ヒット: ${item.name} (${item.directory.name})`;
          const segments = [item.directory.path, item.directory.name, item.name]
            .filter(Boolean)
            .map(s => s.replace(/^\/+|\/+$/g, ''))
            .filter(s => s && s !== '.');
          const encodedPath = segments.map(encodeURIComponent).join('/');
          const imgSrc = `/pgapi/gallery/content/${encodedPath}/1080`;
          img.src = imgSrc;
          thumbCache.set(id, imgSrc);
          const thumbImg = document.getElementById(`thumb-img-${id}`);
          if (thumbImg) {
            thumbImg.src = imgSrc;
            thumbImg.classList.add('loaded');
          }
        } else {
          info.innerText = '該当する画像が見つかりませんでした。';
        }
      } catch (err) {
        info.innerText = '取得エラー: ' + err;
      }
    }

    retryBtn.onclick = fetchImage;
    fetchImage();
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Load on init
  loadPresets();
</script>
